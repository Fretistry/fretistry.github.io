<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Fretistry">
  <!-- Full-bleed app icon: Android and iOS apply their own rounded mask, so the artwork stays inside the central safe zone -->
  <defs>
    <linearGradient id="fretistry-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFCB66"/>
      <stop offset="0.55" stop-color="#F59E2E"/>
      <stop offset="1" stop-color="#E06A1B"/>
    </linearGradient>
    <radialGradient id="fretistry-shine" cx="0.28" cy="0.18" r="0.75">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.38"/>
      <stop offset="0.6" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="512" height="512" fill="url(#fretistry-bg)"/>
  <rect width="512" height="512" fill="url(#fretistry-shine)"/>
  <g transform="translate(256 256) scale(0.8) translate(-256 -256)">
    <g stroke="#3A1F0A" stroke-opacity="0.2" stroke-linecap="round">
      <line x1="40" y1="140" x2="472" y2="140" stroke-width="5"/>
      <line x1="40" y1="198" x2="472" y2="198" stroke-width="6"/>
      <line x1="40" y1="256" x2="472" y2="256" stroke-width="7"/>
      <line x1="40" y1="314" x2="472" y2="314" stroke-width="8"/>
      <line x1="40" y1="372" x2="472" y2="372" stroke-width="9"/>
    </g>
    <g transform="translate(-18 0)">
      <g fill="#22140A">
        <rect x="150" y="104" width="64" height="304" rx="32"/>
        <rect x="150" y="108" width="196" height="64" rx="32"/>
        <rect x="150" y="224" width="140" height="64" rx="32"/>
        <circle cx="352" cy="140" r="50"/>
        <circle cx="300" cy="256" r="46"/>
      </g>
      <circle cx="352" cy="140" r="27" fill="#FFCB66"/>
      <circle cx="300" cy="256" r="30" fill="#2FC2B2"/>
    </g>
  </g>
</svg>
